name: Release

on:
  push:
    branches:
      - "release/ver2-2.0.0"
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Generate assets
        run: |
          go run ./cmd/importsheet
          go run ./cmd/importanimals
          go run ./cmd/validatemotion -runtime-only -require-accepted
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/verify_page_release.py
          git diff --exit-code -- \
            assets/source/animals/generated \
            assets/source/animals/seed-import-report.json \
            assets/sprites
      - name: Test
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
      - name: Build macOS ZIPs
        run: |
          VERSION="${{ env.RELEASE_VERSION }}" GOARCH=arm64 bash scripts/build_macos.sh
          VERSION="${{ env.RELEASE_VERSION }}" GOARCH=amd64 bash scripts/build_macos.sh
      - name: Upload macOS ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: animalsdesktop-macos-zips
          path: |
            dist/AnimalsDesktop-macos-arm64.zip
            dist/AnimalsDesktop-macos-amd64.zip

  windows:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements-dev.txt
      - name: Generate Windows assets
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go run ./cmd/importsheet
          go run ./cmd/importanimals
          go run ./cmd/validatemotion -runtime-only -require-accepted
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/verify_page_release.py
          git diff --exit-code -- `
            assets/source/animals/generated `
            assets/source/animals/seed-import-report.json `
            assets/sprites
      - name: Test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
      - name: Build Windows
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = $env:RELEASE_VERSION
          $baseVersion = ($version -replace '^[vV]', '') -split '[+-]' | Select-Object -First 1
          $parts = @($baseVersion -split '\.')
          $numericVersion = (($parts + @("0", "0", "0", "0")) | Select-Object -First 4) -join "."
          go run ./cmd/winresicon -src docs/assets/animalsdesktop-preview.png -out winres/icon.png
          $winres = Get-Content winres/winres.json -Raw | ConvertFrom-Json
          $winres.RT_MANIFEST.'#1'.'0409'.identity.version = $numericVersion
          $winres.RT_VERSION.'#1'.'0000'.fixed.file_version = $numericVersion
          $winres.RT_VERSION.'#1'.'0000'.fixed.product_version = $numericVersion
          $winres.RT_VERSION.'#1'.'0000'.info.'0409'.FileVersion = $version
          $winres.RT_VERSION.'#1'.'0000'.info.'0409'.ProductVersion = $version
          $winres | ConvertTo-Json -Depth 20 | Set-Content -Path winres/winres.json -Encoding utf8
          go run github.com/tc-hib/go-winres@v0.3.1 make --arch amd64,386 --out cmd/animalsdesktop/rsrc --file-version $version --product-version $version

          $useArtifactSigning = $env:AZURE_CLIENT_ID -and $env:AZURE_TENANT_ID -and $env:AZURE_SUBSCRIPTION_ID -and $env:AZURE_ARTIFACT_SIGNING_ENDPOINT -and $env:AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME -and $env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
          $certPath = ""
          if (-not $useArtifactSigning -and $env:WINDOWS_CERTIFICATE_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP "animalsdesktop-signing.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          }
          function Sign-IfConfigured {
            param([string]$Path)
            if ($useArtifactSigning) {
              Write-Host "Artifact Signing is configured; deferring signing for $Path."
              return
            }
            if (-not $certPath) {
              Write-Host "Signing certificate not configured; leaving $Path unsigned."
              return
            }
            $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if (-not $signtool) {
              throw "signtool.exe was not found, but signing secrets are configured."
            }
            & $signtool.Source sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $Path
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $Path"
            }
            Get-AuthenticodeSignature -FilePath $Path | Format-List Status,SignerCertificate
          }

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -buildvcs=false -ldflags="-H=windowsgui -X main.appVersion=$version" -o dist/AnimalsDesktop-windows-amd64.exe ./cmd/animalsdesktop
          Sign-IfConfigured dist/AnimalsDesktop-windows-amd64.exe
          go build -buildvcs=false -tags animalsdesktop_nonetwork -ldflags="-H=windowsgui -X main.appVersion=$version" -o dist/AnimalsDesktop-windows-amd64-no-network.exe ./cmd/animalsdesktop
          Sign-IfConfigured dist/AnimalsDesktop-windows-amd64-no-network.exe
          $env:GOARCH = "386"
          go build -buildvcs=false -ldflags="-H=windowsgui -X main.appVersion=$version" -o dist/AnimalsDesktop-windows-386.exe ./cmd/animalsdesktop
          Sign-IfConfigured dist/AnimalsDesktop-windows-386.exe
      - name: Azure login for Artifact Signing
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' && env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME != '' && env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME != ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Azure Artifact Signing
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' && env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME != '' && env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\dist\AnimalsDesktop-windows-amd64.exe
            ${{ github.workspace }}\dist\AnimalsDesktop-windows-amd64-no-network.exe
            ${{ github.workspace }}\dist\AnimalsDesktop-windows-386.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Animals Desktop
          description-url: https://github.com/UDteach/AnimalsDesktopV2
      - name: Package Windows
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_VERSION
          $repoUrl = "https://github.com/UDteach/AnimalsDesktopV2"
          $releaseUrl = "$repoUrl/releases/tag/$version"
          Get-AuthenticodeSignature -FilePath dist/AnimalsDesktop-windows-amd64.exe,dist/AnimalsDesktop-windows-amd64-no-network.exe,dist/AnimalsDesktop-windows-386.exe |
            Select-Object Path,Status,SignerCertificate |
            Format-List
          $amd64ExeHash = (Get-FileHash -Algorithm SHA256 dist/AnimalsDesktop-windows-amd64.exe).Hash
          $amd64NoNetworkExeHash = (Get-FileHash -Algorithm SHA256 dist/AnimalsDesktop-windows-amd64-no-network.exe).Hash
          $x86ExeHash = (Get-FileHash -Algorithm SHA256 dist/AnimalsDesktop-windows-386.exe).Hash
          function Write-SecurityFile {
            param(
              [string]$Path,
              [string]$Arch,
              [string]$ZipName,
              [string]$ExeHash,
              [switch]$NoNetwork
            )
            $updateLines = if ($NoNetwork) {
              @"
          - No-network security-check edition.
          - Automatic startup update checks are disabled.
          - Tray update checks, update downloads, and update installation are disabled.
          - The Go net/http update fetch/download implementation is excluded from this build.
          "@
            } else {
              @"
          - Update check is user-triggered from the tray.
          - Updater downloads GitHub release ZIPs and verifies GitHub-provided size and sha256 digest when present.
          "@
            }
            @"
          Animals Desktop Windows release security notes

          Version: $version
          Architecture: $Arch
          Package file: $ZipName
          Executable: AnimalsDesktop.exe
          Executable SHA256: $ExeHash
          Source repository: $repoUrl
          Release page: $releaseUrl

          Expected behavior:
          - Windows taskbar desktop pet app.
          - Runs as the current user; no admin manifest/elevation request.
          $updateLines
          - Updater does not write or launch PowerShell scripts.

          If Microsoft Defender SmartScreen, Microsoft Defender, or McAfee flags this build:
          - Verify the SHA256 above against the release SHA256SUMS.txt file.
          - Submit the exact ZIP/EXE as a false positive to Microsoft Security Intelligence or McAfee Dispute Detection & Allowlisting.
          "@ | Set-Content -Path $Path -Encoding ascii
          }
          New-Item -ItemType Directory -Force dist/package-amd64,dist/package-amd64-no-network,dist/package-386 | Out-Null
          Copy-Item dist/AnimalsDesktop-windows-amd64.exe dist/package-amd64/AnimalsDesktop.exe
          Copy-Item README.md dist/package-amd64/README.md
          Copy-Item packaging/Start-Classic.cmd dist/package-amd64/Start-Classic.cmd
          Write-SecurityFile -Path dist/package-amd64/SECURITY.txt -Arch "windows-amd64" -ZipName "AnimalsDesktop-windows-amd64.zip" -ExeHash $amd64ExeHash
          Copy-Item dist/AnimalsDesktop-windows-amd64-no-network.exe dist/package-amd64-no-network/AnimalsDesktop.exe
          Copy-Item README.md dist/package-amd64-no-network/README.md
          Copy-Item packaging/Start-Classic.cmd dist/package-amd64-no-network/Start-Classic.cmd
          Write-SecurityFile -Path dist/package-amd64-no-network/SECURITY.txt -Arch "windows-amd64-no-network" -ZipName "AnimalsDesktop-windows-amd64-no-network.zip" -ExeHash $amd64NoNetworkExeHash -NoNetwork
          Copy-Item dist/AnimalsDesktop-windows-386.exe dist/package-386/AnimalsDesktop.exe
          Copy-Item README.md dist/package-386/README.md
          Copy-Item packaging/Start-Classic.cmd dist/package-386/Start-Classic.cmd
          Write-SecurityFile -Path dist/package-386/SECURITY.txt -Arch "windows-386" -ZipName "AnimalsDesktop-windows-386.zip" -ExeHash $x86ExeHash
          Compress-Archive -Path dist/package-amd64/AnimalsDesktop.exe,dist/package-amd64/README.md,dist/package-amd64/SECURITY.txt,dist/package-amd64/Start-Classic.cmd -DestinationPath dist/AnimalsDesktop-windows-amd64.zip -Force
          Compress-Archive -Path dist/package-amd64-no-network/AnimalsDesktop.exe,dist/package-amd64-no-network/README.md,dist/package-amd64-no-network/SECURITY.txt,dist/package-amd64-no-network/Start-Classic.cmd -DestinationPath dist/AnimalsDesktop-windows-amd64-no-network.zip -Force
          Compress-Archive -Path dist/package-386/AnimalsDesktop.exe,dist/package-386/README.md,dist/package-386/SECURITY.txt,dist/package-386/Start-Classic.cmd -DestinationPath dist/AnimalsDesktop-windows-386.zip -Force
          $sumLines = Get-FileHash -Algorithm SHA256 dist/AnimalsDesktop-windows-amd64.zip,dist/AnimalsDesktop-windows-amd64-no-network.zip,dist/AnimalsDesktop-windows-386.zip |
            ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }
          $sumLines += "$amd64ExeHash  AnimalsDesktop-windows-amd64.zip/AnimalsDesktop.exe"
          $sumLines += "$amd64NoNetworkExeHash  AnimalsDesktop-windows-amd64-no-network.zip/AnimalsDesktop.exe"
          $sumLines += "$x86ExeHash  AnimalsDesktop-windows-386.zip/AnimalsDesktop.exe"
          $sumLines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: animalsdesktop-windows-zips
          path: |
            dist/AnimalsDesktop-windows-amd64.zip
            dist/AnimalsDesktop-windows-amd64-no-network.zip
            dist/AnimalsDesktop-windows-386.zip
            dist/SHA256SUMS.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          if [ -f "docs/releases/${version}.md" ]; then
            cp "docs/releases/${version}.md" dist/RELEASE_NOTES.md
          else
            {
              echo "# AnimalsDesktop ${version}"
              echo
              echo "See the release assets and SHA256SUMS.txt for downloadable packages and verification hashes."
            } > dist/RELEASE_NOTES.md
          fi
      - name: Prepare release checksums
        shell: bash
        run: |
          set -euo pipefail
          checksum_source="$(find release-assets -type f -name SHA256SUMS.txt -print -quit || true)"
          : > dist/SHA256SUMS.txt
          while IFS= read -r zip_path; do
            hash="$(sha256sum "$zip_path" | awk '{print toupper($1)}')"
            printf '%s  %s\n' "$hash" "$(basename "$zip_path")" >> dist/SHA256SUMS.txt
          done < <(find release-assets -type f -name '*.zip' | sort)
          if [ -n "$checksum_source" ]; then
            sed 's/\r$//' "$checksum_source" | grep '/AnimalsDesktop.exe$' >> dist/SHA256SUMS.txt || true
          fi
          for expected in \
            AnimalsDesktop-macos-amd64.zip \
            AnimalsDesktop-macos-arm64.zip \
            AnimalsDesktop-windows-386.zip \
            AnimalsDesktop-windows-amd64-no-network.zip \
            AnimalsDesktop-windows-amd64.zip
          do
            grep -q "  ${expected}$" dist/SHA256SUMS.txt
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ github.ref_name == 'v0.2.1' || github.ref_name == 'v0.2.2' || github.ref_name == 'v0.2.3' || github.ref_name == 'v0.2.4' || github.ref_name == 'v0.2.5' || github.ref_name == 'v0.2.6' || github.ref_name == 'v0.2.7' || contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: |
            release-assets/**/*.zip
            dist/SHA256SUMS.txt
